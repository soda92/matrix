version: 2

project_name: matrix

before:
  hooks:
    - go mod tidy

builds:
  - id: matrix
    main: .
    binary: matrix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^chore:"
      - "^docs:"
      - "^test:"
